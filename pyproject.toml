[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vatic"
dynamic = ["version"]
description = "Open Source Risk Analysis"
authors = [
    { name = "Saud Zahir", email = "m.saud.zahir@gmail.com" },
]
maintainers = [
    { name = "Saud Zahir", email = "m.saud.zahir@gmail.com" },
    { name = "M Laraib Ali", email = "laraibg786@outlook.com" },
]
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.12"
dependencies = [
    "kaleido>=0.2.1",
    "mcerp>=0.12",
    "numpy>=2.1",
    "plotly>=5.24",
    "python-pptx>=1.0.2",
    "pyside6>=6.8,<6.10",
    "reportlab>=4.2",
    "rich>=13.7",
    "scipy>=1.14",
]

keywords = [
    "monte carlo",
    "latin hypercube",
    "sampling calculator",
    "error propagation",
    "uncertainty",
    "risk analysis",
    "error",
    "real-time",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
# The Microsoft Excel link is Windows-only; the rest of the app, including
# the in-app formula model, works everywhere without it.
excel = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
vatic = "vatic.app:main"

[project.urls]
source = "https://github.com/eggzec/vatic"
releasenotes = "https://github.com/eggzec/vatic/releases/latest"
issues = "https://github.com/eggzec/vatic/issues"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "examples" },
    { include-group = "excel" },
]
docs = [
    "zensical>=0.0.23",
]
lint = [
    "ruff==0.15.*",
]
test = [
    "pytest>=8.0",
]
examples = [
    "openpyxl>=3.1",
]
excel = [
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.uv]
package = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
include = [
    "/vatic",
]
# Brand assets are not Python sources, so they must be named explicitly or the
# installed app falls back to a generic icon and a system font.
artifacts = [
    "/vatic/assets/*.png",
    "/vatic/assets/*.svg",
    "/vatic/assets/*.ico",
    "/vatic/assets/fonts/*.ttf",
    "/vatic/assets/fonts/OFL.txt",
]

[tool.hatch.build.targets.sdist]
include = [
    "/vatic",
    "/assets",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
# CI workflow definitions and the helper scripts they run are not
# part of the published package, so they are out of scope here.
extend-exclude = [".github"]
line-length = 80
indent-width = 4
preview = true
output-format = "grouped"

[tool.ruff.lint]
isort.lines-after-imports = 2
isort.split-on-trailing-comma = false
select = [
    # "ANN", # flake8-annotations (required strict type annotations for public functions)
    # "S",   # flake8-bandit (checks basic security issues in code)
    "BLE", # flake8-blind-except (checks the except blocks that do not specify exception)
    # "FBT", # flake8-boolean-trap (ensure that boolean args can be used with kw only)
    # "E",   # pycodestyle errors (PEP 8 style guide violations)
    "W",   # pycodestyle warnings (e.g., extra spaces, indentation issues)
    "DOC", # pydoclint issues (e.g., extra or missing return, yield, warnings)
    # "A",   # flake8-builtins (check variable and function names to not shadow builtins)
    # "N",   # Naming convention checks (e.g., PEP 8 variable and function names)
    "F",   # Pyflakes errors (e.g., unused imports, undefined variables)
    "I",   # isort (ensures imports are sorted properly)
    "B",   # flake8-bugbear (detects likely bugs and bad practices)
    "TID", # flake8-tidy-imports (checks for banned or misplaced imports)
    "UP",  # pyupgrade (automatically updates old Python syntax)
    "YTT", # flake8-2020 (detects outdated Python 2/3 compatibility issues)
    "FLY", # flynt (converts old-style string formatting to f-strings)
    "PIE", # flake8-pie
    # "PL",  # pylint
    # "RUF", # Ruff-specific rules (additional optimizations and best practices)
]
ignore = [
    # "N803",      # [pep8-naming](https://docs.astral.sh/ruff/rules/invalid-argument-name/)
    # "N806",      # [pep8-naming](https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function/)
    # "PLR2004",   # [pylint](https://docs.astral.sh/ruff/rules/magic-value-comparison/)
    # "S311",      # [flake8-bandit](https://docs.astral.sh/ruff/rules/suspicious-non-cryptographic-random-usage/)
]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
